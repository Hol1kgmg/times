version: "2"
sql:
  - engine: postgresql
    schema: db/migrations
    queries: db/queries
    gen:
      go:
        package: db
        out: internal/db
        sql_package: pgx/v5
        overrides:
          # oapi-codegen の uuid / date-time 型とそのまま突き合わせるため
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: timestamptz
            go_type: time.Time
          - db_type: date
            go_type: time.Time
          # NULL 許可の text は pgtype.Text ではなく *string にして oapi-codegen の optional と揃える
          - db_type: text
            nullable: true
            go_type:
              type: string
              pointer: true
