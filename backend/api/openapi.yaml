openapi: 3.0.3
info:
  title: times API
  version: 0.1.0
paths:
  /health:
    get:
      operationId: health
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
  /items:
    get:
      operationId: listItems
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                # 配列を直接返さない。ページネーションを後から足せるよう object で包む (adr/backend/0004)
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Item"
    post:
      operationId: createItem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewItem"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
        "400":
          $ref: "#/components/responses/BadRequest"
  /items/{id}:
    get:
      operationId: getItem
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /digests/latest:
    get:
      operationId: getLatestDigest
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Digest"
        "404":
          description: Not Found (Digest が 1 件もない)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /auth/sessions:
    post:
      operationId: createSession
      summary: GitHub の code を検証し、管理者の session を発行する
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewSession"
      responses:
        "201":
          description: Created。token はこの応答にだけ現れる
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedSession"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          description: 許可されていない GitHub アカウント、または backend の GitHub 連携が未設定
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "502":
          description: GitHub との通信・応答の検証に失敗 (code が無効な場合も含む)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /auth/sessions/current:
    get:
      operationId: getCurrentSession
      summary: Bearer の session を照合し、管理者を返す
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      operationId: deleteCurrentSession
      summary: Bearer の session を削除する (ログアウト)。存在しなくても 204
      security:
        - bearerAuth: []
      responses:
        "204":
          description: No Content
        "401":
          $ref: "#/components/responses/Unauthorized"
components:
  securitySchemes:
    # 管理者の session トークン (adr/backend/0007)。frontend のサーバー関数が Cookie から転送する。
    # グローバル security は置かず、管理者専用の操作に個別に付ける
    bearerAuth:
      type: http
      scheme: bearer
  responses:
    BadRequest:
      description: Bad Request
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: Unauthorized
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    NewSession:
      type: object
      required: [code, redirectUri]
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 200
          description: GitHub authorize から戻った code
        redirectUri:
          type: string
          format: uri
          description: authorize に渡した redirect_uri。token 交換で GitHub が一致を検証する
    AdminUser:
      type: object
      required: [id, login]
      properties:
        id:
          type: integer
          format: int64
          description: GitHub 固定 ID。サービス内で管理者を指す識別子
        login:
          type: string
    Session:
      type: object
      required: [user, expiresAt]
      properties:
        user:
          $ref: "#/components/schemas/AdminUser"
        expiresAt:
          type: string
          format: date-time
    CreatedSession:
      allOf:
        - $ref: "#/components/schemas/Session"
        - type: object
          required: [token]
          properties:
            token:
              type: string
              description: 不透明トークン。Cookie に入れて Bearer で転送する
    Item:
      type: object
      required: [id, title, createdAt]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        createdAt:
          type: string
          format: date-time
    NewItem:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
    # 1 日付分の記事のまとまり。items は登録時のカテゴリ順・カテゴリ内順 (specs/002 FR-004)
    Digest:
      type: object
      required: [id, entryDate, items]
      properties:
        id:
          type: string
          format: uuid
        entryDate:
          type: string
          format: date
        items:
          type: array
          items:
            $ref: "#/components/schemas/Article"
    Article:
      type: object
      required: [id, category, title, url]
      properties:
        id:
          type: string
          format: uuid
        category:
          $ref: "#/components/schemas/Category"
        title:
          type: string
        url:
          type: string
          format: uri
        description:
          type: string
          description: ページの説明文。取得できた記事だけ持つ
    # 固定 7 カテゴリ。表示順もこの順 (specs/001 FR-007)
    Category:
      type: string
      enum:
        - セキュリティ
        - ホットトピック
        - IT系
        - UI系
        - AI系
        - 面白そうなツール・サービス
        - その他
      # 日本語値からは Go の定数名が作れないので明示する
      x-enum-varnames: [CategorySecurity, CategoryHotTopic, CategoryIT, CategoryUI, CategoryAI, CategoryTools, CategoryOther]
    # RFC 9457 Problem Details。全エラー応答はこの形 (adr/backend/0002)
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
          description: エラー種別。クライアントはこれで分岐する。想定外は about:blank
          enum:
            - about:blank
            - /problems/validation-failed
            - /problems/not-found
            - /problems/unauthorized
            - /problems/forbidden
            - /problems/upstream-failed
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
