openapi: 3.0.3
# summary は書かない。Redoc が operationId を API 名に使い、生成コードの関数名と揃うため
info:
  title: times API
  version: 0.1.0
paths:
  /health:
    get:
      operationId: getHealth
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
  /digests:
    get:
      operationId: listDigests
      description: 登録済みの Digest の日付を、ステータスを問わず新しい順に返す。記事は含まない
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DigestList"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createDigest
      description: 1 日付分の Digest を記事ごと登録する。articles の並びがそのまま表示順になる
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewDigest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Digest"
        "400":
          description: 形式違反 (validation-failed)、その日付の Digest が登録済み (digest-already-exists)、前の Digest で登録済みの URL を普通の親・子として含む (url-already-registered、duplicateUrls 付き。再掲載にできる親は repostable にも入る)、再掲載として送った記事がない・前の日付の公開済み Digest に載っていない (repost-unavailable、duplicateUrls 付き)、今日 (JST) より後の日付で公開しようとした (future-publish)。日付と URL が両方ぶつかるときは digest-already-exists
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /digests/latest:
    get:
      operationId: getLatestDigest
      description: 公開の Digest のうち日付が最新のものを返す。未ログインに見せるのはこの操作だけ
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Digest"
        "404":
          description: Not Found (公開の Digest が 1 件もない)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /digests/published:
    get:
      operationId: listPublishedDigests
      description: 管理者が作成した公開の Digest を、記事ごと日付の新しい順に返す。limit は Digest の件数で数え、1 件の記事は切らない。before を渡すとその日付より前 (その日付を含まない) を返す。ログインユーザーなら誰でも使える (今ログインできるのは管理者だけ)
      security:
        - bearerAuth: []
      parameters:
        - name: before
          in: query
          schema:
            type: string
            format: date
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 31
            default: 7
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DigestPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  # 更新のキーも日付にする。gin は同じ位置に名前の違うパスパラメーター (:entryDate と :id) を置くと panic する
  /digests/{entryDate}:
    parameters:
      - name: entryDate
        in: path
        required: true
        schema:
          type: string
          format: date
    get:
      operationId: getDigestByDate
      description: その日付の Digest を、ステータスを問わず返す
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Digest"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Not Found (その日付の Digest がない)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    put:
      operationId: updateDigest
      description: その日付の Digest の日付と記事一式を置き換える。日付を変えるときは body の entryDate に新しい日付を入れる
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DigestUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Digest"
        "400":
          description: 形式違反 (validation-failed)、変更先の日付に別の Digest が登録済み (digest-already-exists)、他の Digest で登録済みの URL を普通の親・子として含む (url-already-registered、duplicateUrls 付き。再掲載にできる親は repostable にも入る。この Digest に載っている記事は確かめ直さない)、再掲載として送った記事がない・前の日付の公開済み Digest に載っていない (repost-unavailable、duplicateUrls 付き)、保存後の状態が今日 (JST) より後の日付の公開になる (future-publish)、外すとどこにも載らなくなる親に、ほかの日に載っている子がいる (parent-has-children、hideable 付き)。両方ぶつかるときは digest-already-exists
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Not Found (自分の Digest にその日付のものがない)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /articles/domains:
    get:
      operationId: listArticleDomains
      description: 公開の Digest の記事の URL のドメインを、記事の件数の多い順に返す。ログインユーザーなら誰でも使える (今ログインできるのは管理者だけ)
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/DomainQuery"
        - $ref: "#/components/parameters/DomainLimit"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainList"
        "400":
          description: 形式違反 (validation-failed)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /articles/domains/all:
    get:
      operationId: listAllArticleDomains
      description: 登録済みの記事の URL のドメインを、Digest のステータスを問わず記事の件数の多い順に返す。管理者専用
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/DomainQuery"
        - $ref: "#/components/parameters/DomainLimit"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainList"
        "400":
          description: 形式違反 (validation-failed)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /articles/search:
    get:
      operationId: searchArticles
      description: 公開の Digest に載った記事を、タイトルか URL の部分一致で全期間から探し、記事ごとに初掲載日の新しい順で最大 50 件返す。隠した記事は出さない。管理者専用 (specs/020)
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ArticleSearchQuery"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArticleSearchResult"
        "400":
          description: 形式違反 (validation-failed)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /articles/repost-candidates:
    get:
      operationId: listRepostCandidates
      description: 再掲載の候補を searchArticles と同じ条件で探し、初掲載日の新しい順で最大 50 件返す。再掲載の日付と HOT の履歴は返さない。選べるかは画面で判定し、保存時に repost-unavailable で再検証する。管理者専用 (specs/021)
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ArticleSearchQuery"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepostCandidateList"
        "400":
          description: 形式違反 (validation-failed)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /feed:
    get:
      operationId: getFeed
      description: 公開の通知を RSS 2.0 で返す。公開時刻の新しい順に 20 件。frontend の /feed.xml が中継する
      responses:
        "200":
          description: OK
          content:
            application/rss+xml:
              schema:
                type: string
  /feed/images/{entryDate}:
    get:
      operationId: getFeedImage
      description: フィードに載る Digest の日付を入れた画像 (1200×630)。フィードに載らない日付は 404
      parameters:
        - name: entryDate
          in: path
          required: true
          schema:
            type: string
            format: date
      responses:
        "200":
          description: OK
          content:
            image/png:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          description: Not Found (フィードに載る Digest がその日付にない)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /auth/sessions:
    post:
      operationId: createSession
      description: GitHub の code を検証し、管理者の session を発行する
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewSession"
      responses:
        "201":
          description: Created。token はこの応答にだけ現れる
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedSession"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          description: 許可されていない GitHub アカウント、または backend の GitHub 連携が未設定
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "502":
          description: GitHub との通信・応答の検証に失敗 (code が無効な場合も含む)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /auth/sessions/current:
    get:
      operationId: getCurrentSession
      description: Bearer の session を照合し、管理者を返す
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      operationId: deleteCurrentSession
      description: Bearer の session を削除する (ログアウト)。存在しなくても 204
      security:
        - bearerAuth: []
      responses:
        "204":
          description: No Content
        "401":
          $ref: "#/components/responses/Unauthorized"
components:
  securitySchemes:
    # 管理者の session トークン (adr/backend/0007)。frontend のサーバー関数が Cookie から転送する。
    # グローバル security は置かず、管理者専用の操作に個別に付ける
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    DomainQuery:
      name: q
      in: query
      description: ドメインに含まれる文字列。大文字小文字を区別しない
      schema:
        type: string
        maxLength: 100
    DomainLimit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
    ArticleSearchQuery:
      name: q
      in: query
      required: true
      description: タイトルか URL に含まれる文字列。大文字小文字を区別せず、URL はパーセントエンコードした形とも照らす
      schema:
        type: string
        minLength: 1
        maxLength: 100
        # 空白だけの語は strpos でほぼ全件に当たる
        pattern: '\S'
  responses:
    BadRequest:
      description: Bad Request
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: Unauthorized
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    NewSession:
      type: object
      required: [code, redirectUri]
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 200
          description: GitHub authorize から戻った code
        redirectUri:
          type: string
          format: uri
          description: authorize に渡した redirect_uri。token 交換で GitHub が一致を検証する
    AdminUser:
      type: object
      required: [id, login]
      properties:
        id:
          type: integer
          format: int64
          description: GitHub 固定 ID。サービス内で管理者を指す識別子
        login:
          type: string
    Session:
      type: object
      required: [user, expiresAt]
      properties:
        user:
          $ref: "#/components/schemas/AdminUser"
        expiresAt:
          type: string
          format: date-time
    CreatedSession:
      allOf:
        - $ref: "#/components/schemas/Session"
        - type: object
          required: [token]
          properties:
            token:
              type: string
              description: 不透明トークン。Cookie に入れて Bearer で転送する
    # 1 日付分の記事のまとまり。articles は登録時のカテゴリ順・カテゴリ内順 (specs/002 FR-004)
    Digest:
      type: object
      required: [id, entryDate, status, articles]
      properties:
        id:
          type: string
          format: uuid
        entryDate:
          type: string
          format: date
        status:
          $ref: "#/components/schemas/DigestStatus"
        articles:
          type: array
          items:
            $ref: "#/components/schemas/Article"
    DigestPage:
      type: object
      required: [digests]
      properties:
        digests:
          type: array
          items:
            $ref: "#/components/schemas/Digest"
    DigestList:
      type: object
      required: [digests]
      properties:
        digests:
          type: array
          items:
            $ref: "#/components/schemas/DigestSummary"
    DigestSummary:
      type: object
      required: [id, entryDate, status]
      properties:
        id:
          type: string
          format: uuid
        entryDate:
          type: string
          format: date
        status:
          $ref: "#/components/schemas/DigestStatus"
    DomainList:
      type: object
      required: [domains]
      properties:
        domains:
          type: array
          items:
            $ref: "#/components/schemas/DomainCount"
    DomainCount:
      type: object
      required: [host, count]
      properties:
        host:
          type: string
          minLength: 1
        count:
          type: integer
          minimum: 1
    ArticleSearchResult:
      type: object
      required: [articles]
      properties:
        articles:
          type: array
          items:
            $ref: "#/components/schemas/ArticleSearchHit"
    ArticleSearchParent:
      type: object
      required: [url, title]
      description: 子のときだけ入る。親を隠していれば入らない
      properties:
        url:
          type: string
          format: uri
        title:
          type: string
    ArticleSearchHit:
      type: object
      required: [id, url, title, category, firstPublishedOn, repostedOn, hotOn]
      properties:
        id:
          type: string
          format: uuid
        url:
          type: string
          format: uri
        title:
          type: string
        category:
          $ref: "#/components/schemas/Category"
        parent:
          $ref: "#/components/schemas/ArticleSearchParent"
        firstPublishedOn:
          type: string
          format: date
          description: 公開の掲載のうちいちばん古い日付
        repostedOn:
          type: array
          description: それ以外の公開の掲載の日付。古い順
          items:
            type: string
            format: date
        hotOn:
          type: array
          description: 公開の掲載のうち HOT だった日付。古い順
          items:
            type: string
            format: date
    RepostCandidateList:
      type: object
      required: [articles]
      properties:
        articles:
          type: array
          items:
            $ref: "#/components/schemas/RepostCandidate"
    RepostCandidate:
      type: object
      required: [id, url, title, category, firstPublishedOn]
      properties:
        id:
          type: string
          format: uuid
        url:
          type: string
          format: uri
        title:
          type: string
        category:
          $ref: "#/components/schemas/Category"
        parent:
          $ref: "#/components/schemas/ArticleSearchParent"
        firstPublishedOn:
          type: string
          format: date
          description: 公開の掲載のうちいちばん古い日付
    DigestStatus:
      type: string
      enum: [draft, published, private]
      description: draft は一度も公開していない、private はトップに出さないと決めた (取り下げた公開、出さないことにした下書き)
    Article:
      type: object
      required: [id, category, hot, repost, hidden, listed, originalStatus, children]
      description: 再掲載で子があれば、category は子のカテゴリ (specs/018 FR-014)。concealed でなければ title と url を持つ
      properties:
        id:
          type: string
          format: uuid
        category:
          $ref: "#/components/schemas/Category"
        hot:
          type: boolean
          description: ホットトピックかどうか。再掲載なら常に false
        repost:
          type: boolean
          description: 元の記事を参照する再掲載の掲載か。子のために呼び出した、この Digest に載っていない親も true (specs/018 FR-004)
        hidden:
          type: boolean
          description: 子がほかの日にいて外せないので、外す代わりに隠した記事か
        listed:
          type: boolean
          description: この Digest に掲載を持つか。子のために呼び出した親だけ false (specs/018 Revision 4)
        originalStatus:
          $ref: "#/components/schemas/DigestStatus"
        concealed:
          type: boolean
          description: 公開ページでだけ入る。表示しない記事 (隠した記事か、元の掲載の Digest が公開済みでない) の場所を「非公開記事」として残す。title・url・description・firstPublishedOn を持たない
        title:
          type: string
        url:
          type: string
          format: uri
        description:
          type: string
          description: ページの説明文。取得できた記事だけ持つ
        firstPublishedOn:
          type: string
          format: date
          description: 再掲載のときだけ入る。この記事が載っている公開済み Digest のうち、この Digest より前でいちばん古い日付
        originalCategory:
          $ref: "#/components/schemas/Category"
          description: 再掲載のときだけ入る。記事のカテゴリ。子があると category は子のカテゴリになるので、子を外したときの戻り先に使う
        children:
          type: array
          items:
            $ref: "#/components/schemas/ChildArticle"
    # 親に紐づく関連記事。children を持たないので孫は表現できない (親子 2 階層まで)
    ChildArticle:
      type: object
      required: [id, category, hot, repost, hidden, originalStatus, title, url]
      properties:
        id:
          type: string
          format: uuid
        category:
          $ref: "#/components/schemas/Category"
        repost:
          type: boolean
          description: 前の日付に掲載がある子か。記事を書き換えないので、編集画面では動かすだけにする
        hidden:
          type: boolean
          description: 記事が隠されているか
        originalStatus:
          $ref: "#/components/schemas/DigestStatus"
        hot:
          type: boolean
          description: 親が HOT なら常に true (specs/018 FR-016)
        title:
          type: string
        url:
          type: string
          format: uri
        description:
          type: string
    NewDigest:
      type: object
      required: [entryDate, articles]
      properties:
        entryDate:
          type: string
          format: date
        articles:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: "#/components/schemas/DigestEntry"
        status:
          type: string
          enum: [draft, published]
          default: draft
    # 更新では draft を受けない。下書きへ戻せないことをスキーマだけで保証する (specs/006 research R2)
    DigestUpdate:
      type: object
      required: [entryDate, articles]
      properties:
        entryDate:
          type: string
          format: date
        articles:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: "#/components/schemas/DigestEntry"
        status:
          type: string
          enum: [published, private]
          description: 省略すると今のステータスのまま
    NewArticle:
      type: object
      required: [category, title, url]
      properties:
        category:
          $ref: "#/components/schemas/Category"
        hot:
          type: boolean
          default: false
        hidden:
          type: boolean
          default: false
          description: 外す代わりに隠すか。Digest を公開すると false に戻る
        title:
          type: string
          minLength: 1
          maxLength: 300
        url:
          type: string
          format: uri
          # kin-openapi は format: uri を検証しない。href にそのまま出るので javascript: 等を弾く
          pattern: "^https?://"
          maxLength: 2000
        children:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/ChildEntry"
    # url と title、repostOf がそれぞれ必須なので、要素はどちらか一方にだけ当たる
    DigestEntry:
      oneOf:
        - $ref: "#/components/schemas/NewArticle"
        - $ref: "#/components/schemas/RepostArticle"
    # 元の記事を参照する再掲載。タイトル・カテゴリは記事のものを使い、書き換えない (specs/018 FR-004)
    RepostArticle:
      type: object
      required: [repostOf, category]
      properties:
        repostOf:
          type: string
          format: uri
          pattern: "^https?://"
          maxLength: 2000
          description: 再掲載する記事の URL
        category:
          $ref: "#/components/schemas/Category"
        listed:
          type: boolean
          default: false
          description: 子付きのとき、親もこの Digest に載せるか。false なら子のために親を呼び出すだけにする。子がなければ常に載せる (specs/018 Revision 4)
        children:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/ChildEntry"
    # title と url、repostOf がそれぞれ必須なので、要素はどちらか一方にだけ当たる
    ChildEntry:
      oneOf:
        - $ref: "#/components/schemas/NewChildArticle"
        - $ref: "#/components/schemas/RepostChildArticle"
    # 前の日付に掲載がある子。記事の親と同じ親の下でだけ送れる
    RepostChildArticle:
      type: object
      required: [repostOf]
      properties:
        repostOf:
          type: string
          format: uri
          pattern: "^https?://"
          maxLength: 2000
        hot:
          type: boolean
          default: false
    NewChildArticle:
      type: object
      required: [title, url]
      properties:
        hot:
          type: boolean
          default: false
        title:
          type: string
          minLength: 1
          maxLength: 300
        url:
          type: string
          format: uri
          pattern: "^https?://"
          maxLength: 2000
    # 固定 6 カテゴリ。表示順もこの順 (specs/001 FR-007、specs/004 FR-001)
    Category:
      type: string
      enum:
        - セキュリティ
        - IT系
        - UI系
        - AI系
        - 面白そうなツール・サービス
        - その他
      # 日本語値からは Go の定数名が作れないので明示する
      x-enum-varnames: [CategorySecurity, CategoryIT, CategoryUI, CategoryAI, CategoryTools, CategoryOther]
    # RFC 9457 Problem Details。全エラー応答はこの形 (adr/backend/0002)
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
          description: エラー種別。クライアントはこれで分岐する。想定外は about:blank
          enum:
            - about:blank
            - /problems/validation-failed
            - /problems/not-found
            - /problems/unauthorized
            - /problems/forbidden
            - /problems/upstream-failed
            - /problems/url-already-registered
            - /problems/digest-already-exists
            - /problems/future-publish
            - /problems/repost-unavailable
            - /problems/parent-has-children
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        duplicateUrls:
          type: array
          items:
            type: string
          description: url-already-registered と repost-unavailable のときだけ入る。url-already-registered は同じ管理者が別の Digest で登録済みの URL、repost-unavailable は再掲載できない repostOf (送った articles と children のうち該当するものすべて)
        repostable:
          type: array
          description: url-already-registered のときだけ入る。duplicateUrls のうち、再掲載にできる親の URL と元の記事
          items:
            $ref: "#/components/schemas/Repostable"
        hideable:
          type: array
          description: parent-has-children のときだけ入る。外せない親。画面はこの行を隠した行として戻す
          items:
            $ref: "#/components/schemas/Hideable"
    Hideable:
      type: object
      required: [url, title, category]
      properties:
        url:
          type: string
        title:
          type: string
        category:
          $ref: "#/components/schemas/Category"
    Repostable:
      type: object
      required: [url, title, category, firstPublishedOn]
      properties:
        url:
          type: string
        title:
          type: string
        category:
          $ref: "#/components/schemas/Category"
        firstPublishedOn:
          type: string
          format: date
