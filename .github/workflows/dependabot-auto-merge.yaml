name: dependabot-auto-merge

on: pull_request

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  auto-merge:
    # sync で届く派生リポジトリでは動かさない
    # 人が push した Dependabot ブランチを自動マージしないよう、作成者と実行者の両方で絞る
    if: github.repository == 'Hol1kgmg/claude-temp' && github.event.pull_request.user.login == 'dependabot[bot]' && github.actor == 'dependabot[bot]' && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      # 書き込み権限を持つため PR のコードは checkout しない。変更ファイルは API で読む
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
          PR: ${{ github.event.pull_request.html_url }}
        run: |
          # if の条件に gh を入れると、API の失敗が偽として扱われて auto-merge に進む
          files=$(gh api --paginate "repos/$REPO/pulls/$NUMBER/files" -q '.[].filename')
          if grep -qE '(^|/)apm(\.lock)?\.ya?ml$' <<<"$files"; then
            echo "skill / rules の取得元を更新するため手動レビューに回す"
            exit 0
          fi
          # ブランチ保護の必須チェック check が通るまでマージは待たされる
          gh pr merge --auto --squash "$PR"
