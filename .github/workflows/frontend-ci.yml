name: frontend-ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # flake.lock（Nix 環境）を Node.js バージョンの単一の真実にするための解決ジョブ。
  # 後続ジョブは setup-node にこの出力を渡すため、CI と手元の devShell が乖離しない。
  node-version:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@v23
      - id: resolve
        run: |
          version=$(nix eval --raw .#node.version)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "resolved Node.js $version from flake.lock"

  check:
    needs: node-version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        task: [typecheck, lint, lint:markup, test, build]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.1
        with:
          # pnpm のバージョンはルート package.json の packageManager が唯一の定義箇所
          package_json_file: package.json
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ needs.node-version.outputs.version }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      # minimumReleaseAge の再検証はレジストリの遅延で install を止める。lockfile 更新時は pnpm 本体と dependabot の cooldown が守る
      - run: pnpm --dir frontend install --frozen-lockfile --strict-peer-dependencies --trust-lockfile
      # routeTree.gen.ts と openapi.gen.ts は gitignore 対象なので typecheck / test の前に生成する。
      # openapi.gen.ts は postinstall でも生成されるが、install のキャッシュ状態に依存しないよう明示する
      - run: pnpm --dir frontend generate-routes
      - run: pnpm --dir frontend generate-api
      - run: pnpm --dir frontend ${{ matrix.task }}
