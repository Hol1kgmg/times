name: frontend-ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # flake.lock（Nix 環境）を Node.js バージョンの単一の真実にするための解決ジョブ。
  # 後続ジョブは setup-node にこの出力を渡すため、CI と手元の devShell が乖離しない。
  node-version:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@786fff0690178f1234e4e1fe9b536e94f5433196 # v20
      - id: resolve
        run: |
          version=$(nix eval --raw .#node.version)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "resolved Node.js $version from flake.lock"

  check:
    needs: node-version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        task: [typecheck, lint, test]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          # pnpm のバージョンはルート package.json の packageManager が唯一の定義箇所
          package_json_file: package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ needs.node-version.outputs.version }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm --dir frontend install --frozen-lockfile --strict-peer-dependencies
      # routeTree.gen.ts は gitignore 対象なので typecheck / test の前に生成する
      - run: pnpm --dir frontend generate-routes
      - run: pnpm --dir frontend ${{ matrix.task }}
