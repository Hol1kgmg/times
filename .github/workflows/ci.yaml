name: ci

on:
  # main は PR を経由しない直接 push もあるため見る。
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# 検証はここで行う。書き込み権限を持たせない
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # jactionlint はバイナリキャッシュが無く、毎回ソースからビルドする
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@v23
      # resolve-locks.sh の書き戻しと flake.nix のずれを、lock の自動更新で隠さない
      - run: nix flake check --no-update-lock-file
      - run: nix develop .#template --no-update-lock-file -c apm install --frozen
      - env:
          GH_TOKEN: ${{ github.token }}
        run: nix develop .#template --no-update-lock-file -c just lint-actions
