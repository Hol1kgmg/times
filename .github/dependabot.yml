version: 2
# apm ecosystem の beta 指定が不要になった（dependabot-core#16885）かを本番で確かめるまで残す
enable-beta-ecosystems: true
updates:
  # ルート package.json の packageManager (pnpm 本体のバージョン) が対象。
  # corepack が親ディレクトリまで遡って読むため、定義はここ 1 箇所に置く。
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    cooldown:
      default-days: 2

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 2
    groups:
      # markuplint 本体とパーサは同一モノレポで、メジャー間で AST 契約が変わる。
      # 片方だけ更新されると壊れるため、更新種別を問わず 1 PR にまとめる。
      # npm-minor-patch より上に置くこと(先にマッチしたグループが優先される)。
      markuplint:
        patterns:
          - "markuplint"
          - "@markuplint/*"
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "gomod"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    cooldown:
      default-days: 2
    groups:
      gomod-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # compose.yaml と backend/Dockerfile のイメージタグが対象
  - package-ecosystem: "docker"
    directories:
      - "/"
      - "/backend"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    cooldown:
      default-days: 2

  # .github/workflows/ 配下の全 workflow が対象。SHA pin と横の # vN コメントを更新する。
  - package-ecosystem: github-actions
    directory: /
    # 派生側の template-sync（土曜 09:00）より前に終えるため nix と同じ時刻にそろえる
    schedule:
      interval: weekly
      day: saturday
      time: "08:00"
      timezone: Asia/Tokyo
    cooldown:
      default-days: 2

  - package-ecosystem: nix
    directory: /
    schedule:
      interval: weekly
      day: saturday
      time: "08:00"
      timezone: Asia/Tokyo
    cooldown:
      default-days: 2

  # skill / rules はエージェントの挙動を変えるため auto-merge せずレビューする。cooldown は apm では効かない（adr/from-template/0009）
  - package-ecosystem: apm
    directory: /
    schedule:
      interval: weekly
      day: saturday
      time: "08:00"
      timezone: Asia/Tokyo
